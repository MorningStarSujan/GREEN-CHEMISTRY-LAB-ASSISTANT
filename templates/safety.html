{% extends "base.html" %}

{% block content %}

<div class="page-container">

    <div class="page-header">

        <h1>🛡️ Safety Checker</h1>

        <p>
            View laboratory safety information for available chemicals.
        </p>

    </div>

    <div class="experiment-grid">

        {% for chemical in chemicals %}

        <div class="experiment-card">

            <h2>{{ chemical.name }}</h2>

            <p>
                {{ chemical.safety }}
            </p>

            <a href="/safety/{{ loop.index0 }}">
                View Safety →
            </a>

        </div>

        {% endfor %}

    </div>

</div>

{% endblock %}
